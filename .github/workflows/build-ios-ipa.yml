name: Build unsigned iOS IPA

on:
  push:
    branches:
      - ios-ipa-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15-intel
    env:
      # Metro 0.51.1 uses MD4; Node 20 needs OpenSSL's legacy provider for it.
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Keep Node 20 for dependencies; enable OpenSSL legacy algorithms for old Metro's MD4 cache hash.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select and verify Xcode
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          # Preserve locked versions and integrity hashes, but discard obsolete Taobao tarball URLs.
          node -e 'const fs=require("fs"); const p="yarn.lock"; fs.writeFileSync(p, fs.readFileSync(p,"utf8").replace(/^  "resolved" "[^"]+"\n/gm, ""))'
          # Metro preset 0.59.0 is needed to parse syntax used by RN 0.59.9's URL.js.
          # Allow Yarn Classic to refresh yarn.lock for this explicitly pinned preset.
          yarn install --no-frozen-lockfile --registry https://registry.npmjs.org --network-timeout 300000
          node -e "const p=require('metro-react-native-babel-preset/package.json'); if(p.version !== '0.59.0') throw new Error('Unexpected Metro preset: '+p.version); console.log('Metro Babel preset: '+p.version)"
          node --version
          node -p "'OpenSSL: ' + process.versions.openssl"
          node -e "require('crypto').createHash('md4'); console.log('Metro MD4 compatibility: OK')"

      - name: Patch legacy React Native iOS compatibility
        run: |
          set -euo pipefail

          # RN 0.59.9 defaults the legacy glog configure script to armv7.
          GLOG_SCRIPT="node_modules/react-native/scripts/ios-configure-glog.sh"
          test -f "$GLOG_SCRIPT"
          if grep -q 'CURRENT_ARCH="armv7"' "$GLOG_SCRIPT"; then
            sed -i '' 's/CURRENT_ARCH="armv7"/CURRENT_ARCH="arm64"/' "$GLOG_SCRIPT"
          fi
          grep -n 'CURRENT_ARCH=' "$GLOG_SCRIPT"

          # Xcode's Objective-C generics require the module-class array type here.
          BRIDGE_FILE="node_modules/react-native/React/CxxBridge/RCTCxxBridge.mm"
          test -f "$BRIDGE_FILE"
          node <<'NODE'
          const fs = require("fs");
          const file = "node_modules/react-native/React/CxxBridge/RCTCxxBridge.mm";
          let source = fs.readFileSync(file, "utf8");
          const oldText = "_initializeModules:(NSArray<id<RCTBridgeModule>> *)modules";
          const newText = "_initializeModules:(NSArray<Class> *)modules";
          const count = source.split(oldText).length - 1;
          if (count === 0) {
            if (source.includes(newText)) {
              console.log("RCTCxxBridge module-array compatibility patch already present");
            } else {
              throw new Error("Expected RCTCxxBridge _initializeModules signature was not found; refusing an unsafe patch");
            }
          } else if (count !== 1) {
            throw new Error(`Expected exactly one RCTCxxBridge signature, found ${count}; refusing an ambiguous patch`);
          } else {
            source = source.replace(oldText, newText);
            fs.writeFileSync(file, source);
            console.log("Patched RCTCxxBridge _initializeModules to NSArray<Class>");
          }
          NODE
          grep -n '_initializeModules:(NSArray<Class> \*)modules' "$BRIDGE_FILE"

      # react-native-music-control 0.10.4 registers MPRemoteCommand handlers that return void.
      # Current iOS requires MPRemoteCommandHandlerStatus and throws on registration otherwise.
      - name: Patch music control remote command handlers
        run: |
          set -euo pipefail
          MC_FILE="node_modules/react-native-music-control/ios/MusicControlManager.m"
          test -f "$MC_FILE"
          perl -pi -e 's/^- \(void\)(on\w+):\((MP\w+Event)\*\)event \{ (\[self sendEvent.*\];) \}/- (MPRemoteCommandHandlerStatus)$1:($2*)event { $3 return MPRemoteCommandHandlerStatusSuccess; }/' "$MC_FILE"
          COUNT=$(grep -c '^- (MPRemoteCommandHandlerStatus)on' "$MC_FILE")
          echo "Patched handlers: $COUNT"
          test "$COUNT" -eq 13
          if grep -n '^- (void)on[A-Za-z]*:(MP' "$MC_FILE"; then
            echo "Unpatched remote command handler remains" >&2
            exit 1
          fi

      # Run Metro before the expensive native build. This is the exact bundle
      # operation the Xcode build phase performs, but with verbose diagnostics.
      - name: Preflight React Native JavaScript bundle
        env:
          NODE_BINARY: node
        run: |
          set -euo pipefail
          mkdir -p build/preflight/assets
          node node_modules/react-native/cli.js bundle \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --reset-cache \
            --verbose \
            --bundle-output build/preflight/main.jsbundle \
            --assets-dest build/preflight/assets
          test -s build/preflight/main.jsbundle
          ls -lh build/preflight/main.jsbundle

      - name: Build iOS app
        env:
          NODE_BINARY: node
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ios/Listen1.xcodeproj \
            -scheme Listen1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PRODUCT_BUNDLE_IDENTIFIER=com.mohiria.listen1 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            ARCHS=arm64 \
            CURRENT_ARCH=arm64 \
            CLANG_WARN_STRICT_PROTOTYPES=NO \
            OTHER_CFLAGS='-Wno-error=enum-compare -Wno-error=deprecated-declarations' \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -DFOLLY_NO_CONFIG -DFOLLY_MOBILE=1 -DFOLLY_USE_LIBCPP=1 -DFOLLY_HAVE_PTHREAD=1' \
            build | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Listen1.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/main.jsbundle"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Listen1.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/Listen1.ipa
          test -s build/Listen1.ipa
          unzip -l build/Listen1.ipa | head -40

      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-ipa-latest
          target_commitish: ios-ipa-build
          name: Listen1 iOS IPA (latest)
          prerelease: true
          make_latest: false
          files: build/Listen1.ipa
